name: arm-probe
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-24.04-arm          # GitHub-hosted Arm64 (Neoverse-class), free for public repos
    steps:
      - uses: actions/checkout@v4

      - name: Identify the silicon
        run: |
          echo "uname: $(uname -m)  kernel: $(uname -r)"
          echo "--- cpuinfo model ---"
          grep -m1 -i "model name\|CPU part\|BogoMIPS" /proc/cpuinfo || true
          echo "--- feature flags (the acceptance test) ---"
          for f in i8mm asimddp sve sve2 bf16; do
            if grep -qw "$f" /proc/cpuinfo; then echo "PRESENT $f"; else echo "ABSENT  $f"; fi
          done
          echo "--- MIDR ---"
          grep -m1 -i "CPU implementer\|CPU architecture" /proc/cpuinfo || true

      - name: Build and run the i8mm path
        run: |
          set -x
          gcc --version | head -1
          gcc -O2 -march=armv8.6-a+i8mm -o i8mm_test i8mm_test.c -static || \
          gcc -O2 -march=armv8.2-a+i8mm -o i8mm_test i8mm_test.c -static
          ./i8mm_test

      - name: Build and run the DotProd path (control)
        run: |
          gcc -O2 -march=armv8.2-a+dotprod -o sdot_test sdot_test.c -static
          ./sdot_test
